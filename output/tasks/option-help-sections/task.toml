schema_version = "1.4"
# The verifier runs in a fresh copy of the environment and only receives the
# agent's changes as a patch that excludes tests/ (tamper-proof regression suite).
artifacts = ["/tmp/triverify/agent.patch"]

[task]
name = "trinetrasoft/click-option-help-sections"
version = "1.0.0"
description = "Group options under custom headings on the help page"
authors = [{ name = "Trinetra Soft", email = "info@trinetrasoft.com" }]
keywords = ["click", "python", "feature-development", "help output rendering", "help", "formatting"]

[metadata]
repo = "pallets/click"
repo_url = "https://github.com/pallets/click"
base_ref = "8.5.1"
base_commit = "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"
license = "BSD-3-Clause"
language = "python"
test_runner = "pytest"
category = "feature-development"
variation_axis = "help output rendering"
difficulty = "medium"
public_api = ["help_section"]
generator = "triverify 0.1.0"
generation_model = "claude-opus-5-5"
fail_to_pass_count = 11
mutation_score = 1.0
triverify_gates_passed = true

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[[verifier.collect]]
command = "mkdir -p /tmp/triverify && cd /app && git add -A && git diff --cached --binary -- . ':(exclude)tests' > /tmp/triverify/agent.patch"
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
